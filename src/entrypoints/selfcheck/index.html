<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>自检，视频学习笔记</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #111113; color: #edeef0; }
      h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
      .row { margin: 6px 0; padding: 8px; background: #18191b; border: 0.5px solid #363a3f; }
      .ok { border-color: #145750; color: #0bd8b6; }
      .bad { border-color: #72232d; color: #ff9592; }
      .warn { border-color: #5c3d05; color: #ffca16; }
      .k { color: #b0b4ba; }
      code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0 0; color: #b0b4ba; }
      button { margin-right: 8px; padding: 6px 10px; border: 0.5px solid #363a3f; background: #212225; color: #edeef0; cursor: pointer; font: inherit; }
      button:hover { border-color: #12a594; }
      #log { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>自检</h1>
    <div>
      <button id="run">运行自检</button>
      <button id="copy">复制结果</button>
      <button id="clear">清空</button>
    </div>
    <div id="log"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
