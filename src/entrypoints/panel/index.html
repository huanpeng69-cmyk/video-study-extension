<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频学习笔记</title>
    <style>
      /* 常驻侧边栏：宽度由浏览器决定（用户可拖动），高度撑满可用区域。
         不再固定像素尺寸，避免窄侧边栏出现横向滚动。 */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
      .app {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
